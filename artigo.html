<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Artigo | Guardiões do Cerrado</title>

    <link rel="stylesheet" href="css/artigo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

<header class="cabecalho">
    <a href="biblioteca.html" class="voltar">
        ← Biblioteca
    </a>

    <a href="principal.html" class="inicio">
        Guardiões do Cerrado
    </a>
</header>

<main class="artigo">

    <div class="capa-artigo">
        <img
            id="imagem"
            class="imagem-principal"
            src=""
            alt=""
        >

        <div id="imagemAlternativa" class="imagem-alternativa">
            <span id="iconeArtigo">🌿</span>
        </div>
    </div>

    <div class="conteudo">

        <div class="cabecalho-artigo">
            <span id="categoria" class="categoria"></span>

            <h1 id="titulo"></h1>

            <p id="resumo" class="resumo-artigo"></p>

            <div class="informacoes">
                <span>
                    ⏱️
                    <strong id="tempo"></strong>
                </span>

                <span>
                    ⭐
                    <strong id="xp"></strong>
                </span>
            </div>
        </div>

        <section>
            <h2>📖 Sobre</h2>
            <p id="descricao"></p>
        </section>

        <section>
            <h2 id="tituloHabitat">
                🌿 Habitat
            </h2>

            <p id="habitat"></p>
        </section>

        <section>
            <h2 id="tituloAlimentacao">
                🍎 Alimentação
            </h2>

            <p id="alimentacao"></p>
        </section>

        <section>
            <h2 id="tituloImportancia">
                🌎 Importância para o Cerrado
            </h2>

            <p id="importancia"></p>
        </section>

        <section>
            <h2>💡 Curiosidades</h2>

            <ul id="curiosidades"></ul>
        </section>

        <div class="recompensa">

            <div>
                <h3>🎁 Recompensa</h3>

                <p id="textoRecompensa">
                    Complete a leitura para ganhar XP.
                </p>
            </div>

            <button id="concluir">
                Concluir leitura
            </button>

        </div>

        <div class="navegacao-artigos">

            <a
                id="artigoAnterior"
                href="#"
                class="navegacao-artigo"
            >
                ← Artigo anterior
            </a>

            <a
                href="biblioteca.html"
                class="voltar-biblioteca"
            >
                📚 Biblioteca
            </a>

            <a
                id="proximoArtigo"
                href="#"
                class="navegacao-artigo"
            >
                Próximo artigo →
            </a>

        </div>

    </div>

</main>

<div id="mensagem" class="mensagem"></div>

<script src="js/progresso.js"></script>
<script src="js/artigo.js"></script>

</body>
</html>
