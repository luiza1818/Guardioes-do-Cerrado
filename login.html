<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Guardiões do Cerrado</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="container">

    <div class="lado-esquerdo">

        <img src="/WhatsApp Image 2026-09-25 at 07.48.43 (1).png" class="lobo">

        <h1>Guardiões do Cerrado</h1>

        <p>
            Explore a fauna, a flora e torne-se um verdadeiro Guardião do Cerrado.
        </p>

    </div>

    <div class="lado-direito">

        <div class="card">

            <div class="botoes">

                <button class="ativo" id="btnEntrar">
                    Entrar
                </button>

                <button id="btnCadastrar">
                    Cadastrar
                </button>

            </div>

            <form id="login">

                <h2>Entrar</h2>

                <input
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required
                >

                <button class="principal">

                    Entrar

                </button>

                <button type="button" id="btnEsqueciSenha">Esqueci minha senha</button>
            </form>

            <p id="mensagemConta" role="status" aria-live="polite"></p>

            <form id="cadastro">

                <h2>Criar Conta</h2>

                <input
                    type="text"
                    placeholder="Nome"
                    required
                >

                <input
                    type="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    placeholder="Senha"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <input
                    type="password"
                    placeholder="Confirmar Senha"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button class="principal">

                    Criar Conta

                </button>

            </form>

            <form id="recuperar" style="display:none">
                <h2>Redefinir senha</h2>
                <input type="password" placeholder="Nova senha" minlength="8" autocomplete="new-password" required>
                <input type="password" placeholder="Confirmar senha" minlength="8" autocomplete="new-password" required>
                <button type="submit" class="principal">Salvar senha</button>
            </form>

        </div>

    </div>

</div>

<script type="application/json" data-app-src="js/login.js"></script>

<script src="js/vendor/supabase-2.119.0.js"></script>
<script src="js/conta.js"></script>
<script src="js/iniciar-conta.js"></script>
</body>
</html>
